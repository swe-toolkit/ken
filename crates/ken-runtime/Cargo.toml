[package]
name = "ken-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Runtime crate — production content-addressed value store (K3)"

# `RT-FNSPLIT-C3-ACTIVATION` `D1` — the linked starter needs ONE Rust runtime
# authority as its support archive. Copies the landed `ken-host` pattern
# (`ken-host/Cargo.toml`), which is why this is a copy rather than an invention.
# ⛔ The starter links `libken_runtime.a` and NOT also `libken_host.a`: this
# archive already owns the direction `ken-runtime -> ken-host`.
[lib]
crate-type = ["rlib", "staticlib"]

# `AC-10`'s two evasion probes are gated on cfgs rather than features so that no
# `--all-features` build can ever turn a deliberately-uncompilable block on.
# They are separate names because they are run against different profiles: the
# first in the test profile, the second in the production profile, which is the
# only one that can observe the absence of the `#[cfg(test)]` mint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ken_ac10_evasion_probe)',
    'cfg(ken_ac10_production_mint_probe)',
] }

[features]
default = []
# `px8-ds-test-support` IMPLIES `checked-ih-realization-observation`.
#
# The mutation hooks this feature enables call accessors gated on
# `checked-ih-realization-observation` (e.g. `StaticOriginId::observation_ordinal`),
# so enabling the first without the second compiles callers whose callees are gated
# out -- E0599 in CI, which is the configuration `ken-cli`'s dev-dependency produces.
#
# Cost-free: the only enabling edge is in `[dev-dependencies]`, and resolver v2 does
# not unify dev-dependency features into a normal build, so no production build gains
# a feature from this line.
#
# Do not read this as "these two are the whole implication set" -- the criterion is a
# COMMAND, not an enumeration:
#   scripts/ken-cargo check -p ken-runtime --lib --features px8-ds-test-support
px8-ds-test-support = ["checked-ih-realization-observation"]
r3-4b-observation = []
dasm-c2-observation = []
checked-ih-realization-observation = []

[dependencies]
ken-host = { path = "../ken-host" }
cranelift-codegen = "0.113.1"
cranelift-frontend = "0.113.1"
cranelift-jit = "0.113.1"
cranelift-module = "0.113.1"
cranelift-native = "0.113.1"
cranelift-object = "0.113.1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
