[package]
name = "ken-cli"
description = "The `ken` command-line driver."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ken"
path = "src/main.rs"

[features]
dasm-c2-observation = ["ken-runtime/dasm-c2-observation"]

[dependencies]
ken-diagnostic = { path = "../ken-diagnostic" }
ken-kernel = { path = "../ken-kernel" }
ken-elaborator = { path = "../ken-elaborator" }
ken-interp = { path = "../ken-interp" }
ken-runtime = { path = "../ken-runtime" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.186", default-features = false }

[dev-dependencies]
ken-runtime = { path = "../ken-runtime", features = ["px8-ds-test-support"] }
tempfile = "3"
