# RT-COMPOSED-RETURN-FORWARD-RET-EDGE b2 inc1 (F1 retire-with-tie). These 8
# generated-entry capsule mutation controls are #[ignore]'d because the read-half
# forward SSA edge makes them INERT-when-run (the read derives its answer from the
# edge carrier, not the capsule), so the sweep's --run-ignored=only RUN would fail
# them. They are run-exempt via the deferred-inert-control class, whose staleness
# safeguard is the nextest still-ignored check: when inc2's unified read+write
# edge-control migration re-keys each control to a read-edge-carrier mutation and
# un-#[ignore]s it, the test leaves the nextest ignored set and the sweep FAILS
# until these entries are deleted -- the machine-checked expiry. readmission names
# that lift condition (AC-EDGE-CONTROL-REKEY).
[[exemption]]
test_path = "ken-cli::rt_parity_native::generated_entry_capsule_outer_carried"
class = "deferred-inert-control"
readmission = "AC-EDGE-CONTROL-REKEY"

