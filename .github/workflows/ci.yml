name: CI

# Pre-merge gate. The Steward (sole publisher) pushes each wp/<ID> branch and
# opens a PR; these checks are REQUIRED status checks in branch protection, so a
# branch can't merge until they're green (docs/ops/github-setup.md, WP F1). This
# is the compute offload: the heavy jobs run on GitHub runners, not the laptop.
# No merge_group — one publisher serialises merges, so there's no queue.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/ref so rapid pushes don't pile up CI
# (matters even though public-repo Actions minutes are free — it shortens queues).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-paths:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if ! git diff --name-only --no-renames "$base" HEAD | python3 -c 'import json,sys; print(json.dumps([x.rstrip("\\n") for x in sys.stdin if x.rstrip("\\n")]))' > paths.json; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode=full
          if classified=$(python3 scripts/ci-doc-only.py paths.json); then
            mode="$classified"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # The suite is CPU-bound, not scheduling-bound. Measured on run
  # 29838398785: 1891 tests, 3893 CPU-seconds of real work, executed in 984s
  # wall on a 4-vCPU runner — an effective parallelism of 3.96x out of a
  # theoretical 4.00. nextest was already saturating the machine, so no
  # further scheduling change can help. The only two levers left are LESS
  # WORK (see `opt-level` in the root Cargo.toml) and MORE CORES — which is
  # what this matrix buys: 8 shards x 4 vCPU = 32 effective cores.
  #
  # Sharding is by TEST, not by crate. A per-crate matrix would floor at the
  # slowest crate (`ken-cli` holds the heaviest binaries);
  # `--partition count:N/8` ignores crate boundaries and balances by count.
  #
  # This trades ~8x total compute for ~8x wall clock. Actions minutes are
  # free on public repos, so the trade is worth it — but it IS a real
  # increase in compute, not a free win.
  # See docs/program/11-test-suite-and-ci-remediation.md §1/§3.
  test-shard:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: test shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel siblings on first failure — a full picture of which
      # shards failed is worth more than the saved minutes, and shards are
      # independent.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      # NO dependency cache, deliberately. `Swatinem/rust-cache` was removed
      # (item C8): it never measurably helped — the build step is well under
      # a minute either way — and it is third-party code with access to the
      # build, i.e. supply-chain surface taken on for nothing. A dependency
      # has to earn its place. If a future change makes the build genuinely
      # expensive, prefer first-party `actions/cache` and re-argue the case
      # on measured numbers.
      - name: Build
        run: cargo build --workspace --locked
      # Prebuilt binary, not `cargo install cargo-nextest` — the latter
      # would compile nextest itself on every run and add minutes back.
      - name: Install cargo-nextest
        # SHA-PINNED, not tag-tracked. `@nextest` / `@v2` are FLOATING tags the
        # maintainer can repoint at any commit, so a compromised or moved tag
        # would execute new code in our build with no diff and no review. A SHA
        # cannot be moved; upgrading is an explicit, reviewable commit.
        #
        # Pinned to the RELEASE commit (v2.84.0) with the tool passed
        # explicitly, NOT to the `@nextest` alias commit (37ba6721). The alias
        # is auto-generated at publish time and sits off the release lineage
        # with a one-word message, so it is immutable but not reviewable — you
        # cannot map it back to a version without digging. This form is both.
        #
        # To upgrade: pick the new release SHA from
        # https://github.com/taiki-e/install-action/releases and update the
        # comment to match. Keep the version comment in sync with the SHA — a
        # stale version comment is a false provenance claim.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      # nextest schedules every test across every binary against one global
      # thread pool. NOTE: `cargo test` was ALREADY parallel *within* each
      # binary (libtest defaults to one thread per CPU); only the 200 binaries
      # themselves ran serially. So nextest recovered just the inter-binary
      # waste — measured at ~11% (18m26s -> 16m24s on the same test set), not
      # the large win it was first written up as. It is kept because it
      # partitions (below) and because it reports per-test timing.
      #
      # EXCLUDED FROM THE SHARDED LANE — NOT BECAUSE THEY ARE BROKEN OR
      # FLAKY, but because each does a full native codegen-and-link per test
      # case and would dominate whichever shard drew it. Measured at 56.5% of
      # a 47-minute run (docs/program/11-test-suite-and-ci-remediation.md §1):
      #   - crates/ken-cli/tests/rt_parity_native.rs        (14m41s, 7 tests)  RESTORED
      #   - crates/ken-cli/tests/px8f_buffer_native.rs      ( 5m10s, 1 test)   RESTORED
      #   - crates/ken-verify/tests/px8f_write_partition.rs ( 5m09s, 1 test)   RESTORED
      #
      # All three now run in their own dedicated jobs below, in parallel,
      # where they cost no wall clock. They stay in THIS exclusion so they
      # are not ALSO drawn into a shard: the exclusion here and the
      # inclusions there must stay complementary, or a test is silently
      # duplicated or silently dropped — and a dropped test still shows a
      # green gate.
      #
      # `rt_parity_native` was given its own job to serve as a differential
      # (interp-vs-native) oracle rather than as CI hygiene. It carries NO
      # such differential at this candidate: its six `assert_narrowed_alike`
      # rows are ignored and the one row still running is not a differential.
      # The exclusion below is still correct — see `native-rt-parity` below
      # for which nodes re-arm it, and
      # docs/program/issues/CI-SKIPPED-NATIVE-TESTS.md. Measured 7 tests /
      # 266.7s wall / 470.6s CPU as one binary, where
      # `fs_write_at_malformed_offset_narrows_to_invalid_offset` alone takes
      # ~250s against ~35s for its near-identical sibling. That test is the
      # only one of the 7 that opens two nested resource brackets where
      # every sibling opens one — load-bearing to the property under test,
      # not a simplification target — and the two are correlated, but
      # nothing here isolates the topology as the CAUSE of the timing; see
      # docs/program/11-test-suite-and-ci-remediation.md §1f for the
      # unisolated-hypothesis framing.
      - name: Select duration-balanced shard
        run: |
          cargo nextest list --workspace --locked --message-format json > unfiltered-inventory.json
          python3 scripts/ci-duration-shard.py project-filtered unfiltered-inventory.json inventory.json
          python3 scripts/ci-duration-shard.py inventory.json docs/program/evidence/ci-shard-duration-balance-33230600665.json duration-filters
          planned=$(python3 -c 'import json; print(len(json.load(open("duration-filters/assignments.json"))["bins"][${{ matrix.shard }} - 1]["tests"]))')
          if [ "$planned" -eq 0 ]; then
            python3 scripts/ci-duration-shard.py project-empty inventory.json "selected-${{ matrix.shard }}.json"
            touch .planned-empty
          else
            python3 scripts/ci-duration-shard.py project-selected inventory.json duration-filters/assignments.json "${{ matrix.shard }}" "selected-${{ matrix.shard }}.json"
          fi
          python3 scripts/ci-duration-shard.py validate-plan duration-filters/assignments.json "${{ matrix.shard }}" "selected-${{ matrix.shard }}.json"
          scripts/stage-ci-shard-artifact.sh "${{ matrix.shard }}" unfiltered-inventory.json inventory.json "selected-${{ matrix.shard }}.json"
      - name: Test
        run: >-
          scripts/run-ci-shard.sh
          "$(python3 -c 'import json; print(len(json.load(open("duration-filters/assignments.json"))["bins"][${{ matrix.shard }} - 1]["tests"]))')"
          "$(<duration-filters/bin-${{ matrix.shard }}.expr)"
      # nextest does not execute rustdoc tests, so run the workspace doctest
      # population once rather than once per shard.
      - name: Upload realized shard selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realized-shard-${{ matrix.shard }}
          path: realized-shard-${{ matrix.shard }}/*
          if-no-files-found: error
      - name: Doctests
        if: matrix.shard == 1
        run: cargo test --workspace --doc --locked

  # Findings exit zero and route without blocking. Instrument failures exit
  # nonzero and are enforced by build-test's needs/result gate below because no
  # trustworthy measurement was made.
  ignored-row-sweep:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: ignored-row sweep (findings non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      - name: Select and run ignored rows
        shell: bash
        run: |
          python3 scripts/ci-ignored-sweep.py verify-row-claims
          cargo nextest list --workspace --locked --run-ignored=only \
            --message-format json > ignored-row-all.json
          filter=$(python3 scripts/ci-ignored-sweep.py filter \
            ignored-row-all.json)
          expected=$(python3 scripts/ci-ignored-sweep.py expected)
          cargo nextest list --workspace --locked --run-ignored=only \
            -E "$filter" --message-format json > ignored-row-list.json
          python3 scripts/ci-ignored-sweep.py verify-list \
            ignored-row-all.json ignored-row-list.json "$expected"

          set +e
          cargo nextest run --workspace --locked --run-ignored=only \
            --no-fail-fast --color never --status-level pass \
            --final-status-level pass -E "$filter" \
            2>&1 | tee ignored-row-sweep.log
          run_status=${PIPESTATUS[0]}
          set -e

          python3 scripts/ci-ignored-sweep.py report \
            ignored-row-list.json ignored-row-sweep.log \
            "$expected" "$run_status" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Slow native binaries, each restored to the gate in its own job ───────
  #
  # WHY A JOB EACH rather than letting them back into the shards: two of the
  # three (native-write-partition, native-buffer) are a SINGLE #[test] each,
  # running ~4 minutes, so no scheduler can subdivide either one. The third
  # (native-rt-parity) is 7 tests in one binary, dominated by one outlier
  # test — see the exclusion comment below — so it would still become
  # whichever shard drew it, the same problem the single-test binaries have.
  # In a shard any of the three would simply become that shard's critical
  # path and push the whole gate out. Alone and in parallel each costs
  # NOTHING: the worst shard is ~471s and each of these jobs is ~240-332s
  # (native-rt-parity's Build+Test total is the largest of the three), so
  # they finish first and never set the pace. That headroom is the budget
  # for restoring coverage.
  #
  # ⚠ SCOPED ON PURPOSE — `-p <crate> --test <name>`, NOT `--workspace`.
  # With `--workspace`, nextest compiles all 200 test binaries in order to
  # run one: measured 390s of Test step against 266s of actual test
  # execution, i.e. ~124s of pure waste per job per run. Scoping compiles
  # only the target being run.
  # The `Build` step deliberately stays `--workspace`: it is only ~65s, and
  # it is what proves the whole workspace still compiles under `--locked`.
  #
  # ⚠ THESE FILTERS MUST STAY COMPLEMENTARY TO THE SHARD EXCLUSION ABOVE.
  # Each binary is named in FOUR places: excluded from the shard filter
  # above, included in its own dedicated job below, listed in build-test's
  # `needs:`, and checked in the pass/fail loop below that. The four do NOT
  # fail the same way if one drifts from the others — see
  # docs/program/issues/CI-SKIPPED-NATIVE-TESTS.md's Undo section for the
  # per-case reasoning. The two ends of the risk: dropping only the
  # dedicated job while `needs:`/the check loop still name it is a workflow
  # syntax error (loud, nothing runs); dropping only the check-loop entry
  # while the job and `needs:` stay is the dangerous one — the job still
  # runs and gates the schedule, but its result is never inspected, so a
  # real failure there can still leave `build-test` green.
  native-write-partition:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: native-slow (px8f_write_partition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No cache here either — see the note in the sharded job (item C8).
      - name: Build
        run: cargo build --workspace --locked
      - name: Install cargo-nextest
        # SHA-PINNED, not tag-tracked. `@nextest` / `@v2` are FLOATING tags the
        # maintainer can repoint at any commit, so a compromised or moved tag
        # would execute new code in our build with no diff and no review. A SHA
        # cannot be moved; upgrading is an explicit, reviewable commit.
        #
        # Pinned to the RELEASE commit (v2.84.0) with the tool passed
        # explicitly, NOT to the `@nextest` alias commit (37ba6721). The alias
        # is auto-generated at publish time and sits off the release lineage
        # with a one-word message, so it is immutable but not reviewable — you
        # cannot map it back to a version without digging. This form is both.
        #
        # To upgrade: pick the new release SHA from
        # https://github.com/taiki-e/install-action/releases and update the
        # comment to match. Keep the version comment in sync with the SHA — a
        # stale version comment is a false provenance claim.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      # THIS JOB CURRENTLY SELECTS ZERO TESTS, and `--no-tests=pass` is what
      # keeps that from being an error.
      #
      # px8f_write_partition.rs has exactly one `#[test]`, at :354,
      # `checked_write_all_reaches_full_short_zero_progress_flip_and_error_prefixes`,
      # and it is `#[ignore]`d pending RT-CARRIED-RESOURCE-SCALAR. nextest's
      # `--no-tests` default is `auto`, which fails on an empty selection
      # (exit 4, "no tests to run"), so without this flag the job hard-fails
      # and takes the aggregator with it.
      #
      # Read the green here correctly: this job is green because it is EMPTY,
      # not because anything passed. It carries no signal about the write
      # partition while that row is ignored.
      #
      # RT-CARRIED-RESOURCE-SCALAR re-arms it: when that node un-ignores :354
      # the job selects a real test again and this comment stops being true.
      # `--no-tests=pass` suppresses only the empty-selection error, never a
      # failing test, so the flag can stay when the row returns.
      - name: Test
        run: cargo nextest run --locked -p ken-verify --test px8f_write_partition --no-tests=pass

  # ~310s measured pre-C6, ~240s projected post-C6 (C6 gave its sibling
  # px8f_write_partition -22.7%: 309s -> 239s). Fits the same headroom.
  native-buffer:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: native-slow (px8f_buffer_native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --workspace --locked
      - name: Install cargo-nextest
        # SHA-PINNED, not tag-tracked. `@nextest` / `@v2` are FLOATING tags the
        # maintainer can repoint at any commit, so a compromised or moved tag
        # would execute new code in our build with no diff and no review. A SHA
        # cannot be moved; upgrading is an explicit, reviewable commit.
        #
        # Pinned to the RELEASE commit (v2.84.0) with the tool passed
        # explicitly, NOT to the `@nextest` alias commit (37ba6721). The alias
        # is auto-generated at publish time and sits off the release lineage
        # with a one-word message, so it is immutable but not reviewable — you
        # cannot map it back to a version without digging. This form is both.
        #
        # To upgrade: pick the new release SHA from
        # https://github.com/taiki-e/install-action/releases and update the
        # comment to match. Keep the version comment in sync with the SHA — a
        # stale version comment is a false provenance claim.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      # THIS JOB CURRENTLY SELECTS ZERO TESTS, and `--no-tests=pass` is what
      # keeps that from being an error.
      #
      # px8f_buffer_native.rs has exactly one `#[test]`, at :203,
      # `linked_checked_write_all_observes_short_progress_and_matches_interpreter`,
      # and it is `#[ignore]`d pending RT-CARRIED-RESOURCE-SCALAR. nextest's
      # `--no-tests` default is `auto`, which fails on an empty selection
      # (exit 4, "no tests to run"), so without this flag the job hard-fails
      # and takes the aggregator with it.
      #
      # Read the green here correctly: this job is green because it is EMPTY,
      # not because anything passed. It carries no signal about the linked
      # checked-write path while that row is ignored.
      #
      # RT-CARRIED-RESOURCE-SCALAR re-arms it: when that node un-ignores :203
      # the job selects a real test again and this comment stops being true.
      # `--no-tests=pass` suppresses only the empty-selection error, never a
      # failing test, so the flag can stay when the row returns.
      - name: Test
        run: cargo nextest run --locked -p ken-cli --test px8f_buffer_native --no-tests=pass

  # ~266.7s wall measured as one binary (7 tests).
  #
  # ITS DIFFERENTIAL IS CURRENTLY DARK. This binary was restored here to be
  # the interp/native RT-PARITY differential oracle
  # (`assert_narrowed_alike`, `crates/ken-cli/tests/rt_parity_native.rs`),
  # because while it was excluded a green CI carried no information about
  # whether native and interp agreed on these narrowing cases. That is the
  # condition it was built to end, and at this tip the condition is true
  # again: all six `assert_narrowed_alike` rows — :498, :527, :554, :599,
  # :652, :692 — are `#[ignore]`d.
  #
  # The job still runs and still reports green, on the one live row left at
  # :786. That row calls `elaborates()`, a source-scope negative check, and
  # is NOT a differential. So a green here means the source still elaborates;
  # it does not mean the two lanes agree.
  #
  # Two nodes re-arm it, and it takes both: RT-CARRIER-BYTESPAN-OBSERVE owns
  # five of the six rows, and RT-CLOSURE-BOUNDARY-LANE owns :652. Un-ignoring
  # only one node's rows leaves the differential partly dark.
  #
  # This job deliberately does NOT take `--no-tests=pass`, unlike its two
  # px8f siblings above. It still selects a live test, so an empty selection
  # here would mean something broke in selection, and it must stay an error.
  # See docs/program/issues/CI-SKIPPED-NATIVE-TESTS.md.
  native-rt-parity:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: native-slow (rt_parity_native) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --workspace --locked
      - name: Install cargo-nextest
        # SHA-PINNED, not tag-tracked. `@nextest` / `@v2` are FLOATING tags the
        # maintainer can repoint at any commit, so a compromised or moved tag
        # would execute new code in our build with no diff and no review. A SHA
        # cannot be moved; upgrading is an explicit, reviewable commit.
        #
        # Pinned to the RELEASE commit (v2.84.0) with the tool passed
        # explicitly, NOT to the `@nextest` alias commit (37ba6721). The alias
        # is auto-generated at publish time and sits off the release lineage
        # with a one-word message, so it is immutable but not reviewable — you
        # cannot map it back to a version without digging. This form is both.
        #
        # To upgrade: pick the new release SHA from
        # https://github.com/taiki-e/install-action/releases and update the
        # comment to match. Keep the version comment in sync with the SHA — a
        # stale version comment is a false provenance claim.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      - name: Test
        run: >-
          cargo nextest run --locked -p ken-cli --test rt_parity_native
          --partition count:${{ matrix.shard }}/3

  z3-process-adapter:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: optional z3 process adapter
    runs-on: ubuntu-latest
    container: ghcr.io/swe-toolkit/ken/ci-z3@sha256:4043afa445489c19fa9b6628258134225953354e2bf1766d996558cdf73e38da
    steps:
      - uses: actions/checkout@v4
      - name: Verify Z3
        run: z3 -version
      - name: Test feature-on adapter
        run: >-
          cargo test --locked -p ken-elaborator --features z3-process
          --test v3_z3_process_adapter

  z3-emission-control:
    needs: classify-paths
    if: needs.classify-paths.outputs.mode == 'full'
    name: z3 emission control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test binary-independent SMT-LIB emission
        run: >-
          cargo test --locked -p ken-elaborator --features z3-process --lib

  # ⛔ DO NOT RENAME OR DELETE THIS JOB. `build + test` is a REQUIRED status
  # check in branch protection (docs/ops/github-setup.md §"Required status
  # checks"). The sharded matrix above publishes checks named `test shard
  # N/8`, which branch protection does not know about — so if this
  # name-preserving aggregator were removed, the required check would never
  # report and EVERY pull request would become unmergeable until an admin
  # edited branch protection. This job exists so the workflow can be resharded
  # freely without touching repository settings: change the matrix, leave this
  # alone.
  #
  # It is intentionally a pure gate — no checkout, no build, a few seconds.
  #
  # ⚠ EVERY TEST-RUNNING JOB MUST BE LISTED IN `needs` AND CHECKED BELOW.
  # This job is what branch protection actually reads, so a test job missing
  # from here reports GREEN no matter how it failed. Add a job above, add it
  # in both places here.
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    needs:
      - classify-paths
      - test-shard
      - native-write-partition
      - native-buffer
      - native-rt-parity
      - z3-process-adapter
      - z3-emission-control
      - ignored-row-sweep
    # `always()` so this reports a definite conclusion even when a job fails
    # or is skipped. Without it, a failed dependency leaves this job *skipped*,
    # and a skipped required check blocks the PR with no useful signal.
    if: always()
    steps:
      - name: All test jobs passed
        run: |
          shards='${{ needs.test-shard.result }}'
          write='${{ needs.native-write-partition.result }}'
          buffer='${{ needs.native-buffer.result }}'
          rt_parity='${{ needs.native-rt-parity.result }}'
          z3_adapter='${{ needs.z3-process-adapter.result }}'
          z3_emission='${{ needs.z3-emission-control.result }}'
          ignored_sweep='${{ needs.ignored-row-sweep.result }}'
          echo "test-shard matrix:      $shards"
          echo "native-write-partition: $write"
          echo "native-buffer:          $buffer"
          echo "native-rt-parity:       $rt_parity"
          echo "z3-process-adapter:     $z3_adapter"
          echo "z3-emission-control:    $z3_emission"
          echo "ignored-row-sweep:      $ignored_sweep"
          failed=0
          for pair in "test shards:$shards" \
                      "native-write-partition:$write" \
                      "native-buffer:$buffer" \
                      "native-rt-parity:$rt_parity" \
                      "z3-process-adapter:$z3_adapter" \
                      "z3-emission-control:$z3_emission" \
                      "ignored-row-sweep:$ignored_sweep"; do
            name="${pair%:*}"; result="${pair##*:}"
            if [ "$result" != "success" ] && ! { [ '${{ needs.classify-paths.outputs.mode }}' = doc-only ] && [ "$result" = skipped ]; }; then
              echo "::error::$name did not pass ($result)." >&2
              failed=1
            fi
          done
          exit "$failed"

  conformance:
