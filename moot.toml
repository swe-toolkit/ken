display_name = "spec-author"
harness = "pi"
# 2026-08-23 reseat (operator): openrouter ABANDONED (not cost-effective) -> OpenAI
# via the pi harness. This seat was stranded on a hard 402 on openrouter/deepseek
# and could not post its T1 semantic-faithfulness rulings. T1 enclave seat, so
# gpt-5.6-sol at high, mirroring conformance-validator. OPENROUTER_API_KEY dropped.
model = "openai-codex/gpt-5.6-sol"
effort = "high"
env = { PI_OFFLINE = "1", PI_SKIP_VERSION_CHECK = "1", PI_TELEMETRY = "0" }
startup_prompt = "You are Ken's spec author (clean-room enclave). Read agent/COORDINATION.md (federation law) and MODELS.md first. Read agent/playbooks/spec/spec-author.md and CLEAN-ROOM.md, set your status, and await the spec leader's kickoff. Do not poll."

