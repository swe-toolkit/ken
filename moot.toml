# ken federation — moot launch profile. TWO HARNESSES, split 22 / 6.
#
# ⚠ DERIVE WIRING FROM THE `[agents.*]` BLOCKS, NEVER FROM PROSE — INCLUDING
# THIS PROSE. This header has been wrong twice (it once claimed every seat ran
# direct on the Anthropic subscription, and it later still listed four Claude
# Code seats after three had moved). The blocks are the configuration; this is a
# summary that goes stale between edits.
#
# **22 seats — native Codex harness** (`harness = "codex"`, the operator's
# ChatGPT/Codex subscription). Effort is `model_reasoning_effort` on these seats.
#   - `gpt-5.6-sol`   — the seats that author or audit deeply: spec-author,
#                       conformance-validator, librarian, doc-author, research,
#                       and the kernel/verify/ergo/foundation implementers.
#   - `gpt-5.6-terra` — leaders, QA, and the language implementer.
#
# **6 seats — Claude Code direct on the Anthropic subscription** (OAuth via the
# steward's cold-start `/login`; these use `effort`, NOT
# `model_reasoning_effort`). NOT uniformly Opus — do not infer a model from the
# harness:
#   - `steward`   — operator proxy / workflow authority. Opus.
#   - `adversary` — standing red team. Opus.
#   - `architect` — Opus (T1), reseated 2026-08-18. See the note below.
#   - `runtime-leader`, `runtime-implementer`, `runtime-qa` — **Sonnet 5**
#     (T2), reseated 2026-08-18. Not a tier change: MODELS.md names Sonnet 5
#     as one of the two sanctioned T2 options for this ring.

# ⚠ THE 2026-08-18 RESEAT IS PURPOSE-LIMITED (operator). The OpenAI pool hit
# its subscription floor — `runtime-qa`, `runtime-leader`, `research` and
# `architect` all reported the same reset, Aug 20 03:46 — with item 4's `D0`
# candidate held unreviewed. The operator authorised moving **runtime and the
# architect** to Anthropic **solely to land the in-flight work**, narrowing the
# standing "do not fail over to Anthropic" instruction for that purpose only.
#
# ⇒ This is NOT a general failover and NOT a re-tiering. `research` stays on
# Codex and stays idle. When the in-flight work lands, these four seats revert
# to the Codex blocks above unless the operator says otherwise.
#
# ⇒ THE STRANDING RISK MOVES WITH THE HARNESS. All four are Claude Code now, so
# they no longer strand on convo mentions — but `moot compact` is no-op-prone
# there; prefer `send-keys`. The per-tick composer check now belongs only on
# `language-implementer`.
#
# ⚠ THE KEY SPLIT IS THE THING THAT SILENTLY BREAKS. A Codex seat needs
# `harness = "codex"` AND `model_reasoning_effort`; a Claude Code seat has NO
# `harness` key and uses `effort`. Changing `model` alone misconfigures the seat.
# **Measured 2026-08-17: three seats — architect, runtime-implementer,
# language-implementer — were on Claude Code carrying `model_reasoning_effort`,
# each under a comment stating that Claude Code seats use `effort`.** The comment
# and the key disagreed for days and nothing reported it. Their move to Codex
# resolved it; all 28 seats now agree. **Verify with a parse, not by reading:**
#
#   python3 -c "import tomllib;d=tomllib.load(open('moot.toml','rb'))['agents'];\
#   print([n for n,a in d.items() if (a.get('harness')=='codex')!=str(a.get('model','')).startswith('gpt')])"
#
# ⚠ THE 2026-08-17 RESEAT (operator). `architect` -> `gpt-5.6-sol` (high),
# reversing the 2026-08-13 swap; `runtime-implementer` and `language-implementer`
# -> `gpt-5.6-terra` (medium). Both implementer seats had been on Sonnet 5 for
# reasons recorded in their blocks — read those before inferring intent.
#
# ⚠ "MCP startup interrupted ... convo, convo-channel were not initialized" IS
# EXPECTED ON A FRESH LAUNCH AND IS NOT A DEAD TRANSPORT. Measured on all three
# seats of the 2026-08-17 reseat: the warning appeared on every one, and within
# ~60s all three had called `orientation()`, `update_status` and
# `convo-channel.subscribe` successfully. The servers initialize after the
# startup window closes; the message reports the window, not the outcome.
#
# ⇒ **Do not restart a seat on that warning.** Wait and read what the pane
# actually does. Restarting is the expensive wrong move — it costs the seat its
# fresh orientation and, done across a cascade, storms the join endpoint for
# real. A genuinely dead transport looks different: the seat's convo tool calls
# FAIL, and `last_seen_at` stops advancing while the pane still looks busy.

# ⛔ THE TWO HARNESSES NEED DIFFERENT OPERATIONAL HANDLING, and conflating them
# has cost real time. Codex seats: strand on a convo mention (repair with a bare
# `Enter`), take `/compact` reliably via `moot compact`, and need `send-keys -l`
# for literal text. Claude Code seats: do not strand on mentions, and `moot
# compact` is no-op-prone there — prefer `send-keys`. See
# `agent/playbooks/federation/steward.md` §2c for the full mechanics.
#
# ⇒ THE STRANDING RISK MOVED AGAIN ON 2026-08-17, and this is the practical
# consequence. The per-tick composer check belongs on `architect`,
# `runtime-implementer` and `language-implementer` — all three are Codex now and
# all three will strand on mentions. Only `steward` and `adversary` are exempt.

[convo]
api_url = "https://mootup.io"
space_id = "spc_4q7g0se87rgje"

[harness]
# Cold-start role: launched first on `moot up`, used for the interactive
# Anthropic OAuth /login (an Opus/subscription enclave role). The operator's
# primary proxy into the federation.
human_interface = "steward"

# Launch-cascade pacing. mootup defaults this to 2.0s/agent to avoid storming
# the convo join_space endpoint on cold start; we disable it (0) because the
# server-side rate limit was relaxed 10x and the box (t3.small) peaked at ~35%
# CPU under the full 25-agent burst — so the stagger only slows launch for no
# benefit. Re-enable (e.g. 1-2s) if a future, larger fleet herds join_space.
launch_stagger_seconds = 3

